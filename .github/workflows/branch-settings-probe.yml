name: Branch auto-delete invariant probe

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Require delete_branch_on_merge false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read repository setting
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/github-branch-cleanup.mjs settings-probe
          --repo "$GITHUB_REPOSITORY"
          --output delete-branch-on-merge-probe.json

      - name: Retain probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: delete-branch-on-merge-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: delete-branch-on-merge-probe.json
          if-no-files-found: warn
          retention-days: 30
