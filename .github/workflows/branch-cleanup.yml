name: Scoped merged task branch cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: branch-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Recheck and clean one merged task head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch tooling only
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Evaluate exact event head
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/github-branch-cleanup.mjs event
          --event-path "$GITHUB_EVENT_PATH"
          --reviewed-event "$GITHUB_EVENT_PATH"
          --execute
          --output branch-cleanup-decision.json

      - name: Retain decision evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: branch-cleanup-decision.json
          if-no-files-found: warn
          retention-days: 30
